<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옥지 젠더 복권</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE occasion, a little party toy with a twist for two expecting parents
   IDEA a Korean instant lottery ticket (즉석복권): silver foil, then a blue "아들?" layer that turns out to be a second foil
   PICTURE the scratch window; blue decoy baby under the foil, pink baby girl under the decoy
   COLOUR mint ground, white paper, red ticket band, silver foil, decoy blue #2f7de1, final pink #ef5d8f
   TYPE Jua display + Gowun Dodum text
   LAYOUT one column, title then ticket; same on phone, ticket fills width */
:root{color-scheme:light dark;--bg:light-dark(#dff2ea,#0f1d19);--ink:light-dark(#1b2a26,#eaf3ef);--paper:light-dark(#ffffff,#1d2a26);--line:light-dark(#d5e3dd,#33463f);--red:#e8364a;--muted:light-dark(#5b6d67,#a9bbb4);--pink:#ef5d8f;--blue:#2f7de1}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip;word-break:keep-all}
.wrap{max-width:560px;margin:0 auto;padding:clamp(20px,5vw,48px) 16px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:400 clamp(30px,8vw,46px)/1.1 Jua,sans-serif;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 22px;color:var(--muted)}
.snd{flex:none;min-height:44px;padding:0 12px;font-size:14px;border-radius:22px}
.ticket{background:var(--paper);border-radius:18px;box-shadow:0 2px 0 var(--line),0 14px 30px -18px rgba(0,0,0,.35);overflow:hidden;transition:transform .12s ease-out}
.band{background:var(--red);color:#fff;padding:16px 20px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.4px);background-size:12px 12px}
.band b{font:400 26px/1.1 Jua,sans-serif}
.band span{font-size:14px;opacity:.9;white-space:nowrap}
.body{position:relative;padding:20px;border-top:2px dashed var(--line)}
.body::before,.body::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.body::before{left:-11px}.body::after{right:-11px}
.win{position:relative;aspect-ratio:1/1.08;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.prize{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#ffe1ec,#f7a3c0 70%,#ef7fa6);display:grid;grid-template-rows:minmax(0,1fr) auto}
.prize svg{width:100%;height:100%;display:block}
.prize p{margin:0;padding:0 12px 18px;text-align:center;color:#fff;font:400 clamp(36px,11vw,58px)/1 Jua,sans-serif;text-shadow:0 3px 0 rgba(176,40,90,.35)}
.win canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .7s}
.win canvas.off{opacity:0;pointer-events:none}
#decoy{pointer-events:none}
.win.p2 #decoy{pointer-events:auto}
.win.shake{animation:shake .5s}
.win.done .baby{animation:bob 2.4s ease-in-out infinite;transform-origin:150px 200px}
.bar{height:10px;border-radius:5px;background:var(--line);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s,background .3s}
.p2bar .bar i{background:var(--blue)}
.stat{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:14px;color:var(--muted)}
.stat span:last-child{text-align:right}
.msg{margin:16px 0 0;padding:16px;border-radius:14px;text-align:center;font-size:17px;color:#fff;background:var(--ink);min-height:64px}
.msg b{display:block;font:400 24px/1.2 Jua,sans-serif;margin-bottom:2px}
.msg.tease{background:light-dark(#eef2f0,#26332f);color:var(--ink)}
.msg.blue{background:var(--blue)}
.msg.pink{background:var(--pink)}
.msg.pop{animation:pop .45s ease-out}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-size:16px;min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button:active{transform:translateY(1px)}
.hide{display:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;box-shadow:inset 0 0 120px 30px rgba(232,54,74,.55);transition:opacity .35s ease-out}
body.beat #vig{opacity:var(--vi,.4);transition:none}
body.beat .ticket{transform:scale(1.018);transition:none}
body.dim #vig{opacity:.85;box-shadow:inset 0 0 200px 80px rgba(0,0,0,.6)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes shake{20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){.msg.pop,.win.done .baby,.win.shake{animation:none}.win canvas{transition:none}body.beat .ticket{transform:none}}
@media(max-width:400px){.band b{font-size:22px}}
</style>
</head>
<body>
<div id="vig" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <h1>옥지는 아들일까, 딸일까?</h1>
    <button class="snd" id="snd" type="button" aria-pressed="true">소리 켜짐</button>
  </div>
  <p class="sub">손가락으로 은박을 끝까지 긁어 보세요. 소리를 켜 두면 더 떨려요.</p>
  <div class="ticket">
    <div class="band"><b>즉석 젠더 복권</b><span id="dt">제 1회</span></div>
    <div class="body" id="tb">
      <div class="win" id="win">
        <div class="prize" aria-hidden="true">
          <svg viewBox="0 0 300 260" preserveAspectRatio="xMidYMid meet">
            <g fill="#fff" opacity=".8">
              <path id="ht" d="M0 4 C0 -2 8 -2 8 4 C8 -2 16 -2 16 4 C16 10 8 14 8 18 C8 14 0 10 0 4Z"/>
              <use href="#ht" transform="translate(36 40) scale(1.3)"/>
              <use href="#ht" transform="translate(246 58) scale(1.1)"/>
              <use href="#ht" transform="translate(30 170) scale(.9)"/>
              <use href="#ht" transform="translate(252 178) scale(1.4)"/>
              <circle cx="72" cy="104" r="3"/><circle cx="232" cy="122" r="3"/><circle cx="60" cy="226" r="2.5"/><circle cx="244" cy="236" r="2.5"/>
            </g>
            <g class="baby">
              <ellipse cx="150" cy="252" rx="78" ry="40" fill="#fff"/>
              <ellipse cx="150" cy="252" rx="78" ry="40" fill="#ffc6d8" opacity=".55"/>
              <path d="M122 222 Q150 236 178 222 L172 240 Q150 248 128 240Z" fill="#fff"/>
              <circle cx="78" cy="148" r="16" fill="#f6c3a6"/><circle cx="222" cy="148" r="16" fill="#f6c3a6"/>
              <circle cx="150" cy="146" r="76" fill="#ffd9c2"/>
              <path d="M84 132 A66 66 0 0 1 216 132 A76 76 0 0 0 84 132Z" fill="#f2b99c" opacity=".5"/>
              <path d="M150 72 C134 72 130 90 146 92 C140 84 150 78 156 84" fill="none" stroke="#8a5a44" stroke-width="5" stroke-linecap="round"/>
              <path d="M118 150 Q126 140 134 150" fill="none" stroke="#4a3328" stroke-width="5" stroke-linecap="round"/>
              <path d="M166 150 Q174 140 182 150" fill="none" stroke="#4a3328" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="108" cy="172" rx="14" ry="9" fill="#ff9fbd" opacity=".7"/>
              <ellipse cx="192" cy="172" rx="14" ry="9" fill="#ff9fbd" opacity=".7"/>
              <path d="M138 178 Q150 192 162 178" fill="#e8607e" stroke="#c94a68" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(196 88) rotate(18)">
                <path d="M0 0 Q-40 -34 -48 -6 Q-50 18 0 0Z" fill="#ef5d8f"/>
                <path d="M0 0 Q40 -34 48 -6 Q50 18 0 0Z" fill="#ef5d8f"/>
                <path d="M0 0 Q-30 -20 -36 -6 Q-36 6 0 0Z" fill="#d94077"/>
                <path d="M0 0 Q30 -20 36 -6 Q36 6 0 0Z" fill="#d94077"/>
                <path d="M-4 4 L-16 34 L-8 30 L-4 38Z M4 4 L16 34 L8 30 L4 38Z" fill="#ef5d8f"/>
                <circle r="11" fill="#ff7ba6"/><circle cx="-3" cy="-3" r="4" fill="#fff" opacity=".5"/>
              </g>
            </g>
          </svg>
          <p>딸입니다!</p>
        </div>
        <canvas id="decoy" aria-label="두 번째 은박"></canvas>
        <canvas id="foil" aria-label="은박. 긁어서 결과를 확인하세요"></canvas>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="stat"><span id="pct">0% 긁음</span><span id="stage">끝까지 긁으면 결과가 나와요</span></div>
      <div class="msg tease" id="msg" aria-live="polite"><b>두근두근</b>은박 아래에 뭐가 있을까요?</div>
      <div class="row hide" id="after"><button id="again" type="button">다시 긁기</button></div>
    </div>
    <div class="foot"><span>발행: 엄마 · 아빠</span><span>1등 상품: 평생의 행복</span></div>
  </div>
</div>
<script>
{
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const win=$('win'),foil=$('foil'),decoy=$('decoy');
const fctx=foil.getContext('2d'),dctx=decoy.getContext('2d');
const DONE1=.7,DONE2=.62;
let phase=1,started=false,progress=0,drawing=false,last=null,moves=0,shown=-1,locked=false;
let sound=true,beatTimer=null,interval=950;

{const d=new Date();$('dt').textContent=`제 1회 · ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}

/* decoy art: same baby, blue knit cap */
const boySvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260"><g fill="#fff" opacity=".8"><path d="M40 40l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z"/><path d="M252 64l4 9 10 1-7 6 2 10-9-5-9 5 2-10-7-6 10-1z"/><path d="M256 176l4 9 10 1-7 6 2 10-9-5-9 5 2-10-7-6 10-1z"/><circle cx="72" cy="104" r="3"/><circle cx="232" cy="124" r="3"/><circle cx="40" cy="186" r="3"/></g><ellipse cx="150" cy="252" rx="78" ry="40" fill="#fff"/><ellipse cx="150" cy="252" rx="78" ry="40" fill="#9cc6ff" opacity=".6"/><circle cx="78" cy="148" r="16" fill="#f6c3a6"/><circle cx="222" cy="148" r="16" fill="#f6c3a6"/><circle cx="150" cy="146" r="76" fill="#ffd9c2"/><path d="M72 132 A78 78 0 0 1 228 132 Z" fill="#2f7de1"/><rect x="70" y="118" width="160" height="22" rx="11" fill="#1f5fb8"/><g stroke="#2f7de1" stroke-width="3"><path d="M86 121v16M100 121v16M114 121v16M128 121v16M142 121v16M156 121v16M170 121v16M184 121v16M198 121v16M212 121v16"/></g><circle cx="150" cy="58" r="14" fill="#9cc6ff"/><path d="M118 156 Q126 146 134 156" fill="none" stroke="#4a3328" stroke-width="5" stroke-linecap="round"/><path d="M166 156 Q174 146 182 156" fill="none" stroke="#4a3328" stroke-width="5" stroke-linecap="round"/><ellipse cx="108" cy="176" rx="13" ry="8" fill="#ff9fbd" opacity=".55"/><ellipse cx="192" cy="176" rx="13" ry="8" fill="#ff9fbd" opacity=".55"/><path d="M140 184 Q150 194 160 184" fill="none" stroke="#c94a68" stroke-width="4" stroke-linecap="round"/></svg>`;
const boyImg=new Image();
boyImg.onload=()=>{if(!started)paintDecoy()};
boyImg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(boySvg);

function size(cv){
  const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  return dpr;
}
function paintDecoy(){
  size(decoy);const W=decoy.width,H=decoy.height,x=dctx;
  x.globalCompositeOperation='source-over';
  const g=x.createRadialGradient(W/2,H*.38,0,W/2,H*.38,W*.8);
  g.addColorStop(0,'#e3f1ff');g.addColorStop(.7,'#8dbdf5');g.addColorStop(1,'#5f9fe9');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  if(boyImg.complete&&boyImg.naturalWidth){
    const ah=H*.8,sc=Math.min(W/300,ah/260),iw=300*sc,ih=260*sc;
    x.drawImage(boyImg,(W-iw)/2,(ah-ih)/2,iw,ih);
  }
  x.fillStyle='#fff';x.textAlign='center';x.textBaseline='alphabetic';
  x.font=`${Math.round(W*.15)}px Jua, sans-serif`;
  x.shadowColor='rgba(20,60,130,.35)';x.shadowOffsetY=W*.008;
  x.fillText('아들...?',W/2,H*.95);x.shadowColor='transparent';
}
function paintFoil(){
  size(foil);const W=foil.width,H=foil.height,x=fctx,dpr=Math.min(devicePixelRatio||1,2);
  x.globalCompositeOperation='source-over';
  const g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#c4cad0');g.addColorStop(.35,'#eef1f3');g.addColorStop(.5,'#b3bac2');g.addColorStop(.7,'#e4e8eb');g.addColorStop(1,'#bfc5cc');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  let s=11;const rnd=()=>(s=s*16807%2147483647)/2147483647;
  x.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<220;i++){x.beginPath();x.arc(rnd()*W,rnd()*H,(rnd()*1.8+.5)*dpr,0,7);x.fill()}
  x.save();x.fillStyle='rgba(80,88,98,.16)';x.font=`${Math.round(W*.06)}px Jua, sans-serif`;x.textAlign='center';x.textBaseline='middle';
  for(let y=-1;y<8;y++)for(let i=-1;i<5;i++)x.fillText('긁어주세요',(i+(y%2)*.5)*W*.32,y*H*.14);
  x.restore();
  x.fillStyle='rgba(60,68,78,.8)';x.textAlign='center';x.textBaseline='middle';
  x.font=`${Math.round(W*.3)}px Jua, sans-serif`;x.fillText('?',W/2,H*.42);
  x.font=`${Math.round(W*.075)}px Jua, sans-serif`;x.fillText('여기를 긁어 보세요',W/2,H*.68);
}

/* sound engine: master bus with compressor + synthetic reverb */
const S={ctx:null,out:null,rev:null,noise:null,scr:null,drone:null};
function audio(){
  if(!sound)return null;
  try{
    if(!S.ctx){
      const c=S.ctx=new (window.AudioContext||window.webkitAudioContext)();
      const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(c.destination);
      S.out=c.createGain();S.out.gain.value=.9;S.out.connect(comp);
      const len=Math.floor(c.sampleRate*2.6),ir=c.createBuffer(2,len,c.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
      const cv=c.createConvolver();cv.buffer=ir;S.rev=c.createGain();S.rev.gain.value=.3;S.rev.connect(cv);cv.connect(S.out);
      const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);
      for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;S.noise=nb;
    }
    if(S.ctx.state==='suspended')S.ctx.resume();
  }catch(e){S.ctx=null}
  return S.ctx;
}
const on=()=>sound&&S.ctx&&S.out;
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function noiseSrc(){const s=S.ctx.createBufferSource();s.buffer=S.noise;s.loop=true;return s}
function dest(g,wet){g.connect(S.out);if(wet)g.connect(S.rev)}
function osc(type,f,t,stop){const o=S.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(stop);return o}

/* heartbeat: pitched body + muffled noise knock, lub then dub */
function thud(t,v,wet){
  const c=S.ctx,g=c.createGain(),o=osc('sine',100,t,t+.32);
  o.frequency.exponentialRampToValueAtTime(40,t+.13);env(g,t,.005,v,.24);o.connect(g);dest(g,wet);
  /* phone speakers drop below ~150Hz, so add an audible upper knock */
  const g2=c.createGain(),o2=osc('triangle',210,t,t+.2);o2.frequency.exponentialRampToValueAtTime(95,t+.1);env(g2,t,.004,v*.45,.12);o2.connect(g2);dest(g2,wet);
  const n=noiseSrc(),f=c.createBiquadFilter(),ng=c.createGain();f.type='lowpass';f.frequency.value=380;
  env(ng,t,.003,v*.7,.07);n.connect(f).connect(ng);dest(ng,wet);n.start(t,Math.random());n.stop(t+.14);
}
function heart(strong){if(!on())return;const t=S.ctx.currentTime+.01,v=strong?1:.65;thud(t,v,strong);thud(t+.17,v*.55,strong)}

/* scratch-card rasp: band-passed noise that follows finger speed */
function scrStart(){
  if(!on()||S.scr)return;
  const c=S.ctx,n=noiseSrc(),hp=c.createBiquadFilter(),bp=c.createBiquadFilter(),g=c.createGain();
  hp.type='highpass';hp.frequency.value=1400;bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=.8;g.gain.value=0;
  n.connect(hp).connect(bp).connect(g).connect(S.out);n.start();S.scr={n,g,bp};
}
function scrMove(d){
  if(!S.scr)return;
  const t=S.ctx.currentTime,v=Math.min(.32,d*.014),g=S.scr.g.gain;
  g.cancelScheduledValues(t);g.setTargetAtTime(v,t,.012);g.setTargetAtTime(0,t+.06,.05);
  S.scr.bp.frequency.setTargetAtTime(2400+Math.random()*2200,t,.02);
}
function scrStop(){if(!S.scr)return;const s=S.scr;S.scr=null;try{const t=S.ctx.currentTime;s.g.gain.cancelScheduledValues(t);s.g.gain.setTargetAtTime(0,t,.03);s.n.stop(t+.25)}catch(e){}}

/* low tension drone that opens up as the foil comes off */
function droneStart(){
  if(!on()||S.drone)return;
  const c=S.ctx,t=c.currentTime,lp=c.createBiquadFilter(),g=c.createGain();
  lp.type='lowpass';lp.frequency.value=160;lp.Q.value=5;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+2);
  const os=[55,55.4,82.6,110.3].map(f=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start(t);return o});
  lp.connect(g);dest(g,true);S.drone={os,lp,g};
}
function droneSet(p){if(!S.drone)return;const t=S.ctx.currentTime;S.drone.lp.frequency.setTargetAtTime(160+p*p*1400,t,.4);S.drone.g.gain.setTargetAtTime(.045+p*.07,t,.4)}
function droneStop(){if(!S.drone)return;const d=S.drone;S.drone=null;try{const t=S.ctx.currentTime;d.g.gain.cancelScheduledValues(t);d.g.gain.setTargetAtTime(.0001,t,.03);d.os.forEach(o=>o.stop(t+.4))}catch(e){}}

/* FM bell */
function bell(t,f,v,dec,wet=true){
  const c=S.ctx,car=osc('sine',f,t,t+dec+.1),mod=osc('sine',f*3.51,t,t+dec+.1),mg=c.createGain(),g=c.createGain();
  mg.gain.setValueAtTime(f*2.2,t);mg.gain.exponentialRampToValueAtTime(1,t+dec*.6);mod.connect(mg).connect(car.frequency);
  env(g,t,.004,v,dec);car.connect(g);dest(g,wet);
}
/* "아들이에요...?" a doubtful two-note bell over a low boom */
function sting(){if(!on())return;const t=S.ctx.currentTime+.02;thud(t,.8,true);bell(t+.05,659.3,.22,1.4);bell(t+.45,622.3,.2,2)}
/* "땡!" a struck bell */
function ttaeng(){if(!on())return;const t=S.ctx.currentTime+.01;bell(t,880,.5,1.8);bell(t,1318.5,.18,1.2);thud(t,.7,true)}
/* wipe: rising airy whoosh */
function whoosh(dur){
  if(!on())return;
  const c=S.ctx,t=c.currentTime+.01,n=noiseSrc(),bp=c.createBiquadFilter(),g=c.createGain();
  bp.type='bandpass';bp.Q.value=1.6;bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(7000,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+dur*.8);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.25);
  n.connect(bp).connect(g);dest(g,true);n.start(t);n.stop(t+dur+.3);
}
/* reveal: popper, warm major-chord bloom, bell arpeggio, sparkles */
function fanfare(){
  if(!on())return;
  const c=S.ctx,t=c.currentTime+.02;
  [0,.09].forEach(dt=>{const n=noiseSrc(),bp=c.createBiquadFilter(),g=c.createGain();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=.9;env(g,t+dt,.002,.6,.12);n.connect(bp).connect(g);dest(g,true);n.start(t+dt,Math.random());n.stop(t+dt+.2)});
  thud(t,.9,true);
  const lp=c.createBiquadFilter(),pg=c.createGain();lp.type='lowpass';lp.frequency.setValueAtTime(500,t);lp.frequency.exponentialRampToValueAtTime(3800,t+.6);
  pg.gain.setValueAtTime(.0001,t);pg.gain.exponentialRampToValueAtTime(.14,t+.08);pg.gain.exponentialRampToValueAtTime(.0001,t+3.2);
  lp.connect(pg);dest(pg,true);
  [261.6,329.6,392,523.3].forEach(f=>[-6,6].forEach(cents=>{const o=osc('sawtooth',f,t,t+3.3);o.detune.value=cents;o.connect(lp)}));
  [523.3,659.3,784,1046.5,1318.5,1568,2093].forEach((f,i)=>bell(t+.12+i*.075,f,.16,1.4));
  let s=3;const rnd=()=>(s=s*16807%2147483647)/2147483647;
  for(let i=0;i<16;i++)bell(t+.6+rnd()*1.6,2200+rnd()*3200,.05,.6);
}
function beat(strong){
  heart(strong);
  try{navigator.vibrate&&navigator.vibrate(strong?[50,90,40]:[30,100,25])}catch(e){}
  document.body.style.setProperty('--vi',String(.25+Math.min(.5,(phase===1?progress*.35:.35+progress*.25))));
  document.body.classList.remove('beat');void document.body.offsetWidth;document.body.classList.add('beat');
  setTimeout(()=>document.body.classList.remove('beat'),140);
}
function startBeat(){
  stopBeat();
  const loop=()=>{beat(false);beatTimer=setTimeout(loop,interval)};
  loop();
}
function stopBeat(){clearTimeout(beatTimer);beatTimer=null}

/* status text */
const T1=[[0,'tease','두근두근','은박 아래에 뭐가 있을까요?'],[.12,'tease','어...?','파란색이 살짝 보이는데요?'],[.35,'tease','혹시...?','파란 모자... 설마 아들?!'],[.6,'tease','거의 다 왔어요','심장 소리 들리세요?']];
const T2=[[0,'blue','한 번 더 긁어 보세요','파란 은박 아래에 진짜 결과가 있어요'],[.1,'tease','어?!','분홍색이... 보이는 것 같은데요?'],[.33,'tease','잠깐만요...','리본...? 설마...?!'],[.55,'tease','조금만 더!','숨 참으세요']];
function say(cls,b,t,pop){const m=$('msg');m.className='msg '+cls+(pop?' pop':'');m.innerHTML=`<b>${b}</b>${t}`}
function tease(){
  const list=phase===1?T1:T2;let k=0;
  list.forEach((r,i)=>{if(progress>=r[0])k=i});
  if(k!==shown){shown=k;say(list[k][1],list[k][2],list[k][3],true)}
}
function setBar(p){
  const v=Math.min(100,Math.round(p*100));
  $('bar').style.width=v+'%';$('pct').textContent=`${v}% 긁음`;
}

/* scratching */
const cur=()=>phase===1?foil:decoy;
const pt=(cv,e)=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
function scratch(p){
  const cv=cur(),x=cv.getContext('2d');
  x.globalCompositeOperation='destination-out';x.lineCap='round';x.lineJoin='round';x.lineWidth=cv.width*.11;
  x.beginPath();x.moveTo(...(last||p));x.lineTo(...p);x.stroke();
  if(last)scrMove(Math.hypot(p[0]-last[0],p[1]-last[1])*cv.clientWidth/cv.width);
  last=p;
  if(++moves%5===0)check();
}
function check(){
  if(locked)return;
  const cv=cur(),d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;let clear=0,tot=0;
  for(let k=3;k<d.length;k+=80){tot++;if(d[k]<40)clear++}
  const goal=phase===1?DONE1:DONE2;
  progress=Math.min(1,clear/tot/goal);setBar(progress);
  interval=phase===1?950-progress*430:480-progress*220;
  droneSet(progress);tease();
  if(progress>=1){if(phase===1)twist();else finale()}
}
function down(e){
  if(locked||e.currentTarget!==cur())return;
  audio();scrStart();
  if(!started){started=true;droneStart();startBeat()}
  drawing=true;last=null;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
  scratch(pt(e.currentTarget,e));
}
[foil,decoy].forEach(cv=>{
  cv.addEventListener('pointerdown',down);
  cv.addEventListener('pointermove',e=>{if(drawing&&!locked&&cv===cur())scratch(pt(cv,e))});
  const up=()=>{scrStop();if(drawing){drawing=false;last=null;check()}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
});

/* the fake-out */
function twist(){
  locked=true;drawing=false;stopBeat();scrStop();droneStop();
  foil.classList.add('off');setBar(1);sting();
  say('blue','아들이에요...?','파란 모자를 쓴 아기가 나왔어요',true);
  $('stage').textContent='1단계 완료';
  setTimeout(()=>{document.body.classList.add('dim')},1300);
  setTimeout(()=>{beat(true)},1700);
  setTimeout(()=>{beat(true)},2300);
  setTimeout(()=>{
    document.body.classList.remove('dim');
    win.classList.remove('shake');void win.offsetWidth;win.classList.add('shake');
    say('tease','땡! 아들이 아니라...','',true);
    ttaeng();
    try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
  },3000);
  setTimeout(wipe,3700);
}
function wipe(){
  const W=decoy.width,H=decoy.height,R=Math.hypot(W,H)/2,t0=performance.now(),dur=reduce?1:900;
  dctx.globalCompositeOperation='destination-out';whoosh(dur/1000);
  const step=t=>{
    const k=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-(1-k)**3;
    dctx.beginPath();dctx.arc(W/2,H*.45,R*e*1.05,0,7);dctx.fill();
    if(k<1)requestAnimationFrame(step);else finale();
  };
  requestAnimationFrame(step);
}
function finale(){
  locked=true;drawing=false;stopBeat();
  decoy.classList.add('off');win.classList.add('done');setBar(1);
  $('stage').textContent='결과 공개';
  say('pink','딸입니다!','옥지는 공주님이에요. 축하해 주세요!',true);
  fanfare();
  try{navigator.vibrate&&navigator.vibrate([80,60,80,60,200])}catch(e){}
  $('after').classList.remove('hide');
  if(!reduce)confetti();
}

function reset(){
  stopBeat();scrStop();droneStop();phase=1;started=false;progress=0;moves=0;shown=-1;locked=false;interval=950;
  foil.classList.remove('off');decoy.classList.remove('off');win.classList.remove('done','p2','shake');$('tb').classList.remove('p2bar');
  document.body.classList.remove('dim','beat');
  $('after').classList.add('hide');$('stage').textContent='끝까지 긁으면 결과가 나와요';setBar(0);
  paintDecoy();paintFoil();tease();
}
$('again').addEventListener('click',reset);
$('snd').addEventListener('click',()=>{
  sound=!sound;$('snd').textContent=sound?'소리 켜짐':'소리 꺼짐';$('snd').setAttribute('aria-pressed',String(sound));
  if(sound)audio();else{scrStop();droneStop()}
});

const ro=new ResizeObserver(()=>{if(!started){paintDecoy();paintFoil()}});ro.observe(win);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!started){paintDecoy();paintFoil()}});

function confetti(){
  const c=$('fx'),x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  const cols=['#ef5d8f','#ffb3cc','#ffffff','#ffd23f','#f78db0','#d94077'];
  const ps=Array.from({length:200},()=>({x:c.width*(.5+(Math.random()-.5)*.3),y:c.height*.45,vx:(Math.random()-.5)*17*dpr,vy:-(Math.random()*16+6)*dpr,r:(Math.random()*5+4)*dpr,a:Math.random()*6,va:(Math.random()-.5)*.3,col:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const step=t=>{
    x.clearRect(0,0,c.width,c.height);
    for(const p of ps){p.vy+=.35*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r,-p.r*.4,p.r*2,p.r*.8);x.restore()}
    if(t-t0<4500)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);
  };
  requestAnimationFrame(step);
}
}
