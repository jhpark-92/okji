<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옥지 젠더 복권</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE occasion, a little party toy for two expecting parents
   IDEA a Korean instant lottery ticket (즉석복권) with one big silver foil window
   PICTURE the ticket; scratching the foil uncovers a drawn baby girl with a pink bow
   COLOUR mint ground, white paper, red ticket band, silver foil, pink #ef5d8f underneath
   TYPE Jua display + Gowun Dodum text
   LAYOUT one column, title then ticket; same on phone, ticket fills width */
:root{color-scheme:light dark;--bg:light-dark(#dff2ea,#0f1d19);--ink:light-dark(#1b2a26,#eaf3ef);--paper:light-dark(#ffffff,#1d2a26);--line:light-dark(#d5e3dd,#33463f);--red:#e8364a;--muted:light-dark(#5b6d67,#a9bbb4);--pink:#ef5d8f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:clamp(20px,5vw,48px) 16px 40px}
h1{font:400 clamp(30px,8vw,46px)/1.1 Jua,sans-serif;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 22px;color:var(--muted)}
.ticket{background:var(--paper);border-radius:18px;box-shadow:0 2px 0 var(--line),0 14px 30px -18px rgba(0,0,0,.35);overflow:hidden}
.band{background:var(--red);color:#fff;padding:16px 20px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.4px);background-size:12px 12px}
.band b{font:400 26px/1.1 Jua,sans-serif}
.band span{font-size:14px;opacity:.9;white-space:nowrap}
.body{position:relative;padding:20px;border-top:2px dashed var(--line)}
.body::before,.body::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.body::before{left:-11px}.body::after{right:-11px}
.win{position:relative;aspect-ratio:1/1.08;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.prize{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#ffe1ec,#f7a3c0 70%,#ef7fa6);display:grid;grid-template-rows:minmax(0,1fr) auto}
.prize svg{width:100%;height:100%;display:block}
.prize p{margin:0;padding:0 12px 18px;text-align:center;color:#fff;font:400 clamp(36px,11vw,58px)/1 Jua,sans-serif;text-shadow:0 3px 0 rgba(176,40,90,.35)}
.win canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .6s}
.win.done canvas{opacity:0;pointer-events:none}
.bar{height:10px;border-radius:5px;background:var(--line);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.stat{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:14px;color:var(--muted)}
.msg{margin:16px 0 0;padding:16px;border-radius:14px;background:var(--pink);color:#fff;text-align:center;font-size:17px;display:none}
.msg.show{display:block;animation:pop .5s ease-out}
.msg b{display:block;font:400 26px/1.2 Jua,sans-serif;margin-bottom:2px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-size:16px;min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button:active{transform:translateY(1px)}
.hide{display:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.win.done .baby{animation:bob 2.4s ease-in-out infinite;transform-origin:150px 200px}
@media(prefers-reduced-motion:reduce){.msg.show,.win.done .baby{animation:none}.win canvas{transition:none}}
@media(max-width:400px){.band b{font-size:22px}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <h1>옥지는 아들일까, 딸일까?</h1>
  <p class="sub">손가락으로 은박을 끝까지 긁어 보세요.</p>
  <div class="ticket">
    <div class="band"><b>즉석 젠더 복권</b><span id="dt">제 1회</span></div>
    <div class="body">
      <div class="win" id="win">
        <div class="prize" aria-hidden="true">
          <svg viewBox="0 0 300 260" preserveAspectRatio="xMidYMid meet">
            <g fill="#fff" opacity=".8">
              <path id="ht" d="M0 4 C0 -2 8 -2 8 4 C8 -2 16 -2 16 4 C16 10 8 14 8 18 C8 14 0 10 0 4Z"/>
              <use href="#ht" transform="translate(36 40) scale(1.3)"/>
              <use href="#ht" transform="translate(246 58) scale(1.1)"/>
              <use href="#ht" transform="translate(30 170) scale(.9)"/>
              <use href="#ht" transform="translate(252 178) scale(1.4)"/>
              <circle cx="72" cy="104" r="3"/><circle cx="232" cy="122" r="3"/><circle cx="60" cy="226" r="2.5"/><circle cx="244" cy="236" r="2.5"/>
            </g>
            <g class="baby">
              <ellipse cx="150" cy="252" rx="78" ry="40" fill="#fff"/>
              <ellipse cx="150" cy="252" rx="78" ry="40" fill="#ffc6d8" opacity=".55"/>
              <path d="M122 222 Q150 236 178 222 L172 240 Q150 248 128 240Z" fill="#fff"/>
              <circle cx="78" cy="148" r="16" fill="#f6c3a6"/><circle cx="222" cy="148" r="16" fill="#f6c3a6"/>
              <circle cx="150" cy="146" r="76" fill="#ffd9c2"/>
              <path d="M84 132 A66 66 0 0 1 216 132 A76 76 0 0 0 84 132Z" fill="#f2b99c" opacity=".5"/>
              <path d="M150 72 C134 72 130 90 146 92 C140 84 150 78 156 84" fill="none" stroke="#8a5a44" stroke-width="5" stroke-linecap="round"/>
              <path d="M118 150 Q126 140 134 150" fill="none" stroke="#4a3328" stroke-width="5" stroke-linecap="round"/>
              <path d="M166 150 Q174 140 182 150" fill="none" stroke="#4a3328" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="108" cy="172" rx="14" ry="9" fill="#ff9fbd" opacity=".7"/>
              <ellipse cx="192" cy="172" rx="14" ry="9" fill="#ff9fbd" opacity=".7"/>
              <path d="M138 178 Q150 192 162 178" fill="#e8607e" stroke="#c94a68" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(196 88) rotate(18)">
                <path d="M0 0 Q-40 -34 -48 -6 Q-50 18 0 0Z" fill="#ef5d8f"/>
                <path d="M0 0 Q40 -34 48 -6 Q50 18 0 0Z" fill="#ef5d8f"/>
                <path d="M0 0 Q-30 -20 -36 -6 Q-36 6 0 0Z" fill="#d94077"/>
                <path d="M0 0 Q30 -20 36 -6 Q36 6 0 0Z" fill="#d94077"/>
                <path d="M-4 4 L-16 34 L-8 30 L-4 38Z M4 4 L16 34 L8 30 L4 38Z" fill="#ef5d8f"/>
                <circle r="11" fill="#ff7ba6"/><circle cx="-3" cy="-3" r="4" fill="#fff" opacity=".5"/>
              </g>
            </g>
          </svg>
          <p>딸이에요!</p>
        </div>
        <canvas id="foil" aria-label="은박. 긁어서 결과를 확인하세요"></canvas>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="stat"><span id="pct">0% 긁음</span><span>끝까지 긁으면 짠!</span></div>
      <div class="msg" id="msg" aria-live="polite"><b>옥지는 공주님이에요</b>축하해 주셔서 고마워요!</div>
      <div class="row hide" id="after"><button id="again" type="button">다시 긁기</button></div>
    </div>
    <div class="foot"><span>발행: 엄마 · 아빠</span><span>1등 상품: 평생의 행복</span></div>
  </div>
</div>
<script>
{
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const win=$('win'),cv=$('foil'),ctx=cv.getContext('2d');
const DONE_AT=.7;
let started=false,finished=false,drawing=false,last=null,moves=0;

{const d=new Date();$('dt').textContent=`제 1회 · ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}

function paint(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  const W=cv.width,H=cv.height;
  ctx.globalCompositeOperation='source-over';
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#c4cad0');g.addColorStop(.35,'#eef1f3');g.addColorStop(.5,'#b3bac2');g.addColorStop(.7,'#e4e8eb');g.addColorStop(1,'#bfc5cc');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  let s=11;const rnd=()=>(s=s*16807%2147483647)/2147483647;
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<220;i++){ctx.beginPath();ctx.arc(rnd()*W,rnd()*H,(rnd()*1.8+.5)*dpr,0,7);ctx.fill()}
  ctx.save();ctx.fillStyle='rgba(80,88,98,.16)';ctx.font=`${Math.round(W*.06)}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(let y=-1;y<8;y++)for(let x=-1;x<5;x++)ctx.fillText('긁어주세요',(x+(y%2)*.5)*W*.32,y*H*.14);
  ctx.restore();
  ctx.fillStyle='rgba(60,68,78,.8)';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${Math.round(W*.3)}px Jua, sans-serif`;ctx.fillText('?',W/2,H*.42);
  ctx.font=`${Math.round(W*.075)}px Jua, sans-serif`;ctx.fillText('여기를 긁어 보세요',W/2,H*.68);
}

const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
function scratch(p){
  ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=cv.width*.11;
  ctx.beginPath();ctx.moveTo(...(last||p));ctx.lineTo(...p);ctx.stroke();last=p;
  if(++moves%5===0)check();
}
function check(){
  const d=ctx.getImageData(0,0,cv.width,cv.height).data;let clear=0,tot=0;
  for(let k=3;k<d.length;k+=80){tot++;if(d[k]<40)clear++}
  const f=clear/tot;
  $('bar').style.width=Math.min(100,Math.round(f/DONE_AT*100))+'%';
  $('pct').textContent=`${Math.min(100,Math.round(f/DONE_AT*100))}% 긁음`;
  if(f>=DONE_AT)finish();
}
function finish(){
  if(finished)return;finished=true;drawing=false;
  win.classList.add('done');$('bar').style.width='100%';$('pct').textContent='100% 긁음';
  setTimeout(()=>{$('msg').classList.add('show');$('after').classList.remove('hide')},500);
  try{navigator.vibrate&&navigator.vibrate([60,40,120])}catch(e){}
  if(!reduce)confetti();
}

cv.addEventListener('pointerdown',e=>{if(finished)return;started=drawing=true;last=null;try{cv.setPointerCapture(e.pointerId)}catch(_){}scratch(pt(e))});
cv.addEventListener('pointermove',e=>{if(drawing)scratch(pt(e))});
const up=()=>{if(drawing){drawing=false;last=null;check()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

const ro=new ResizeObserver(()=>{if(!started)paint()});ro.observe(cv);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!started)paint()});

$('again').addEventListener('click',()=>{
  started=finished=false;moves=0;win.classList.remove('done');$('msg').classList.remove('show');$('after').classList.add('hide');
  $('bar').style.width='0';$('pct').textContent='0% 긁음';paint();
});

function confetti(){
  const c=$('fx'),x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  const cols=['#ef5d8f','#ffb3cc','#ffffff','#ffd23f','#f78db0','#d94077'];
  const ps=Array.from({length:180},()=>({x:c.width*(.5+(Math.random()-.5)*.3),y:c.height*.45,vx:(Math.random()-.5)*16*dpr,vy:-(Math.random()*15+6)*dpr,r:(Math.random()*5+4)*dpr,a:Math.random()*6,va:(Math.random()-.5)*.3,col:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const step=t=>{
    x.clearRect(0,0,c.width,c.height);
    for(const p of ps){p.vy+=.35*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r,-p.r*.4,p.r*2,p.r*.8);x.restore()}
    if(t-t0<4500)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);
  };
  requestAnimationFrame(step);
}
}
</script>
</body>
</html>
